services:
  # ============================================================================
  # 1. MongoDB Database Service
  # Authenticated database with dedicated named volume and healthcheck
  # ============================================================================
  mongo:
    image: mongo:7.0.15
    container_name: hospital_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-rootadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-rootpassword_demo_mode}
      MONGO_DATABASE: ${MONGO_DATABASE:-hospital_db}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-hospital_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-apppassword_demo_mode}
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - hospital_net
    # Ports must NOT be published to host to enforce isolation
    expose:
      - '27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')", '--quiet']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ============================================================================
  # 2. Doctor Appointment Express API Service
  # Production multi-stage Node.js 22 runtime running as non-root user
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-hospital-platform-app:latest}
    container_name: hospital_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://${MONGO_APP_USERNAME:-hospital_app}:${MONGO_APP_PASSWORD:-apppassword_demo_mode}@mongo:27017/${MONGO_DATABASE:-hospital_db}?authSource=${MONGO_DATABASE:-hospital_db}
      JWT_SECRET: ${JWT_SECRET:-jwt_secret_devops_assignment_key_32chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_METRICS: ${ENABLE_METRICS:-true}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - hospital_net
    # Ports must NOT be published to host; only nginx reverse proxy routes traffic
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ============================================================================
  # 3. Nginx Reverse Proxy & TLS Termination
  # Sole public gateway listening on ports 80 and 443 with self-signed TLS
  # ============================================================================
  nginx:
    image: nginx:1.27.4-alpine
    container_name: hospital_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - hospital_net
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          '--no-check-certificate',
          'https://localhost/health',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  hospital_net:
    driver: bridge
    name: hospital_network

volumes:
  mongo_data:
    name: hospital_mongo_data
