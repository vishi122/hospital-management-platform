name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

# Global least-privilege permissions
permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. Lint, Code Quality & Database Integration Tests
  # ============================================================================
  lint-and-test:
    name: Lint & Test Suite
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0.15
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Clean Dependencies
        run: npm ci

      - name: Run ESLint Check
        run: npm run lint

      - name: Run Prettier Format Check
        run: npm run format:check

      - name: Dependency Vulnerability Audit (High/Critical)
        run: npm audit --audit-level=high

      - name: Run Automated Test Suite (Integration & Concurrency)
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/hospital_ci_test
          JWT_SECRET: ci_pipeline_jwt_secret_minimum_32_characters_key
          LOG_LEVEL: error
          ENABLE_METRICS: 'true'
        run: |
          npm test
          npm run test:concurrency

  # ============================================================================
  # 2. Container Build & Security Scan (Trivy)
  # ============================================================================
  container-scan:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Container Image for Scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: hospital-platform-app:scan
          cache-from: type=gha

      - name: Scan Image with Trivy (Vulnerabilities & Misconfigurations)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hospital-platform-app:scan
          format: table
          exit-code: 0
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ============================================================================
  # 3. Publish Container Image to GitHub Container Registry (GHCR)
  # Executed only on main branch pushes or version tags (v*)
  # ============================================================================
  publish-ghcr:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: [lint-and-test, container-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write # Least privilege: packages write granted only to publish job

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata and Tags
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_LOWER}"
          GIT_SHA="${{ github.sha }}"
          SHORT_SHA=$(echo "${GIT_SHA}" | cut -c1-7)

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="run-${{ github.run_number }}"
          fi

          TAGS="${IMAGE}:${VERSION},${IMAGE}:sha-${SHORT_SHA},${IMAGE}:latest"
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output Digest in Job Summary and Logs
        run: |
          DIGEST="${{ steps.build-push.outputs.digest }}"
          echo "=========================================================="
          echo "Successfully published container image to GHCR!"
          echo "Image: ${{ steps.meta.outputs.image }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo "Digest: ${DIGEST}"
          echo "=========================================================="

          # Write structured markdown summary for GitHub UI
          echo "## 🚀 Container Deployment Artifact" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Registry** | \`ghcr.io\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ steps.meta.outputs.image }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Version Tag** | \`${{ steps.meta.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Git Commit SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Immutable Digest** | \`${DIGEST}\` |" >> $GITHUB_STEP_SUMMARY
